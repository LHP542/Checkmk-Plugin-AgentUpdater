# **Forgejo-Fassung von .github/workflows/release.yml.**
#
# Erzeugt von Werkzeuge/forgejo/workflow-uebertragen.py am 27.10.2026.
# Gebaut wird fuer git.flexfamily.de; die GitHub-Fassung bleibt vorerst
# daneben bestehen.
#
# **Beide Dateien gehoeren synchron.** Wer an den Bauschritten etwas
# aendert, zieht es hier nach -- sonst laufen die Seiten auseinander, und
# das faellt erst auf, wenn eine von beiden rot wird.

name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build Checkmk-Plugin-AgentUpdater.slnx -c Release

      - name: Package plugin artifact
        run: |
          set -e
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          mkdir -p artifacts
          # Nur die Plugin-DLL — nicht die Contracts-DLL (kommt vom Cockpit).
          cp "CheckmkPlugin.AgentUpdater/bin/Release/net10.0-windows10.0.19041.0/CheckmkPlugin.AgentUpdater.dll" artifacts/
          (cd artifacts && zip -q "$OLDPWD/Checkmk-Plugin-AgentUpdater-${version}.zip" CheckmkPlugin.AgentUpdater.dll)

      - name: Read release notes
        id: notes
        run: |
          set -e
          tag="${{ github.ref_name }}"
          datei="RELEASE_NOTES/${tag}.md"
          if [ -f "$datei" ]; then text="$(cat "$datei")"; else text="Plugin-Release ${tag}."; fi
          # Mehrzeiliger Ausgabewert braucht ein eindeutiges Trennwort --
          # sonst beendet ein "EOF" im Text die Zuweisung vorzeitig.
          marke="EOF_$(date +%s%N)"
          { echo "body<<${marke}"; echo "$text"; echo "${marke}"; } >> "$GITHUB_OUTPUT"

      - name: Release anlegen und Dateien anhaengen
        env:
          # Forgejo legt diesen Token je Lauf an; er gilt nur fuer dieses
          # Repo und nur solange der Lauf dauert.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # Besteht das Release schon (zweiter Lauf desselben Tags), werden
          # die Dateien ersetzt statt mit HTTP 409 abzubrechen.
          id=$(curl -sf -H "Authorization: token $TOKEN" \
                 "$SERVER/api/v1/repos/$REPO/releases/tags/$TAG" 2>/dev/null \
               | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' 2>/dev/null || true)
          if [ -z "$id" ]; then
            id=$(curl -sf -X POST -H "Authorization: token $TOKEN" \
                   -H "Content-Type: application/json" \
                   -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Gebaut von Forgejo Actions.\"}" \
                   "$SERVER/api/v1/repos/$REPO/releases" \
                 | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          fi
          [ -n "$id" ] || { echo "Keine Release-ID erhalten"; exit 1; }

          hochgeladen=0
          # download-artifact@v3 legt je Artefakt ein Unterverzeichnis an,
          # deshalb rekursiv suchen statt im Arbeitsverzeichnis zu raten.
          for datei in $(find . -type f \( -name "Checkmk-Plugin-AgentUpdater-*.zip" \) | sort); do
            [ -f "$datei" ] || continue
            # Gleichnamigen Anhang vorher loeschen, sonst haengt Forgejo die
            # Datei ein zweites Mal an statt sie zu ersetzen.
            alt=$(curl -sf -H "Authorization: token $TOKEN" \
                    "$SERVER/api/v1/repos/$REPO/releases/$id/assets" 2>/dev/null \
                  | python3 -c "import json,sys; print(next((str(a['id']) for a in json.load(sys.stdin) if a['name']=='$(basename "$datei")'), ''))" 2>/dev/null || true)
            [ -n "$alt" ] && curl -s -X DELETE -H "Authorization: token $TOKEN" \
              "$SERVER/api/v1/repos/$REPO/releases/$id/assets/$alt" >/dev/null
            echo "lade hoch: $datei ($(du -h "$datei" | cut -f1))"
            curl -sf -X POST -H "Authorization: token $TOKEN" \
              -F "attachment=@$datei" \
              "$SERVER/api/v1/repos/$REPO/releases/$id/assets?name=$(basename "$datei")" >/dev/null
            hochgeladen=$((hochgeladen+1))
          done
          # **Ein Release ohne Dateien ist kein Release.** Lieber hier rot
          # als eine leere Seite, die niemand bemerkt.
          [ "$hochgeladen" -gt 0 ] || { echo "Keine Datei hochgeladen"; exit 1; }
          echo "Fertig ($hochgeladen Dateien): $SERVER/$REPO/releases/tag/$TAG"