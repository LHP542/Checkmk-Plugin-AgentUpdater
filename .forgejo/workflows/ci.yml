# **Forgejo-Fassung von .github/workflows/ci.yml.**
#
# Erzeugt von Werkzeuge/forgejo/workflow-uebertragen.py am 27.10.2026.
# Gebaut wird fuer git.flexfamily.cloud; die GitHub-Fassung bleibt vorerst
# daneben bestehen.
#
# **Beide Dateien gehoeren synchron.** Wer an den Bauschritten etwas
# aendert, zieht es hier nach -- sonst laufen die Seiten auseinander, und
# das faellt erst auf, wenn eine von beiden rot wird.
#
# Diese Datei muss hier liegen, auch wenn sie unveraendert ist: Sobald
# .forgejo/workflows existiert, ignoriert Forgejo .github/workflows
# vollstaendig. Ohne die Kopie laeuft in Forgejo gar keine CI mehr.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer braucht die Tags

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Checkmk-Plugin-AgentUpdater.slnx

      - name: Build
        run: dotnet build Checkmk-Plugin-AgentUpdater.slnx -c Release --no-restore
